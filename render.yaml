services:
  - type: web
    name: datly-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATA_DIR
        value: ./data
      - key: CORS_ORIGINS
        value: "https://datly-xk2f.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: NVIDIA_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
